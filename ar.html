<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1410" />
  <title>Hobbiton AR</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500&family=Noto+Serif+SC:wght@600&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:#0f1410; --parchment:#f4e9d0; --parchment-dim:#cdbf9f;
      --gold:#c9a227; --gold-soft:#d9bf63; --border:#3a4a32;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      font-family:"Inter","Noto Sans SC",sans-serif; color:var(--parchment);
      background:var(--bg); min-height:100dvh; overflow:hidden; -webkit-font-smoothing:antialiased;
    }

    /* Layer 0a: themed backdrop (shown until camera starts) */
    .backdrop {
      position:fixed; inset:0; z-index:0;
      background:
        radial-gradient(120% 80% at 50% 0%, #22321f 0%, transparent 55%),
        radial-gradient(100% 80% at 50% 100%, #141f18 0%, transparent 60%),
        var(--bg);
    }
    /* Layer 0b: live camera feed */
    #cam {
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover; z-index:0; background:#000; display:none;
    }
    body.cam-on #cam { display:block; }
    body.cam-on .backdrop { display:none; }

    /* Layer 1: the 3D model, transparent background so the layer behind shows */
    model-viewer {
      position:fixed; inset:0; width:100vw; height:100dvh; z-index:1;
      background:transparent; --poster-color:transparent;
    }

    /* Top bar */
    .topbar {
      position:fixed; top:0; left:0; right:0; z-index:5;
      display:flex; align-items:center; gap:12px;
      padding:max(16px,env(safe-area-inset-top)) 18px 14px;
      background:linear-gradient(180deg, rgba(15,20,16,.9), transparent);
    }
    body.cam-on .topbar { background:linear-gradient(180deg, rgba(0,0,0,.55), transparent); }
    .back {
      display:inline-flex; align-items:center; gap:8px; min-height:44px;
      padding:8px 14px 8px 10px; color:var(--parchment); text-decoration:none;
      background:rgba(30,42,32,.7); border:1px solid var(--border);
      border-radius:999px; font-size:.85rem; font-weight:500; backdrop-filter:blur(8px);
    }
    .back svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; }
    .topbar .title {
      font-family:"Cinzel",serif; font-size:1.05rem; font-weight:600; letter-spacing:.02em;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .lang-zh .topbar .title { font-family:"Noto Serif SC",serif; }

    /* Compact control, anchored to the bottom-right corner */
    .ar-cta {
      position:fixed; right:16px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:6;
      display:inline-flex; align-items:center; gap:8px;
      font-family:inherit; font-size:.85rem; font-weight:600; color:#1a1407; cursor:pointer;
      background:linear-gradient(180deg, var(--gold) 0%, #b4901f 100%);
      border:1px solid var(--gold-soft); border-radius:999px;
      padding:10px 16px; min-height:44px; max-width:80vw;
      box-shadow:0 8px 22px rgba(201,162,39,.35);
    }
    .ar-cta svg { width:18px; height:18px; stroke:#1a1407; fill:none; stroke-width:2; flex:0 0 auto; }
    /* When camera is on the button shrinks to a round icon-only close button */
    body.cam-on .ar-cta {
      padding:0; width:44px; height:44px; justify-content:center; gap:0;
      background:rgba(20,28,22,.6); color:var(--parchment); border-color:var(--border);
      backdrop-filter:blur(10px); box-shadow:none;
    }
    body.cam-on .ar-cta svg { stroke:var(--parchment); }
    body.cam-on .ar-cta #arLabel { display:none; }

    .real-hint {
      position:fixed; left:16px; right:16px;
      bottom:calc(28px + env(safe-area-inset-bottom)); z-index:6;
      display:none; align-items:center; justify-content:center; gap:7px; text-align:center;
      color:var(--parchment-dim); font-size:.8rem; font-weight:300;
    }
    .real-hint svg { width:15px; height:15px; stroke:var(--bad,#a8442a); fill:none; stroke-width:1.8; flex:0 0 auto; }

    /* Loading */
    .loader {
      position:fixed; inset:0; z-index:10; display:grid; place-items:center;
      background:var(--bg); transition:opacity .5s ease;
    }
    .loader.hidden { opacity:0; pointer-events:none; }
    .loader .ring {
      width:54px; height:54px; border-radius:50%;
      border:2px solid rgba(201,162,39,.25); border-top-color:var(--gold);
      animation:spin 1s linear infinite;
    }
    .loader .txt { margin-top:18px; font-family:"Cinzel",serif; letter-spacing:.12em; color:var(--gold-soft); font-size:.9rem; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion:reduce){ .loader .ring{ animation:none; } * { transition:none !important; } }
  </style>
</head>
<body>
  <div class="backdrop"></div>
  <video id="cam" playsinline autoplay muted></video>

  <div class="topbar">
    <a class="back" id="backBtn" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      <span id="backLabel">Map</span>
    </a>
    <span class="title" id="title">Hobbiton</span>
  </div>

  <model-viewer
    id="mv"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    environment-image="neutral"
    exposure="1"
    alt="Hobbiton AR character"></model-viewer>

  <button class="ar-cta" id="arBtn">
    <svg id="arIcon" viewBox="0 0 24 24"><path d="M3 7h3l2-2h8l2 2h3v12H3z"/><circle cx="12" cy="13" r="3.4"/></svg>
    <span id="arLabel">See in your real world</span>
  </button>

  <div class="real-hint">
    <svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/></svg>
    <span id="realHint">Opens your camera — the character appears in the real scene</span>
  </div>

  <div class="loader" id="loader">
    <div style="text-align:center">
      <div class="ring"></div>
      <div class="txt" id="loaderTxt">Summoning…</div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("point") || "frodo";
    const lang = Store.lang;
    const tr = t(lang);
    const point = getPoint(id) || POINTS[0];
    const info = tr.points[point.id];

    if (lang === "zh") document.body.classList.add("lang-zh");
    document.documentElement.lang = lang;

    // Copy
    document.getElementById("title").textContent = info.name;
    document.getElementById("backLabel").textContent = tr.back;
    document.getElementById("arLabel").textContent = tr.arCta;
    document.getElementById("realHint").textContent = tr.realBgHint;
    document.getElementById("loaderTxt").textContent = tr.loading;

    // Model
    const mv = document.getElementById("mv");
    mv.setAttribute("src", point.model);
    mv.setAttribute("scale", point.scale || "1 1 1");
    mv.setAttribute("alt", info.name);

    // Loader
    const loader = document.getElementById("loader");
    const hideLoader = () => loader.classList.add("hidden");
    mv.addEventListener("load", hideLoader);
    setTimeout(hideLoader, 12000);

    // --- Live camera background (real AR feel, fully in-browser) ---
    const cam = document.getElementById("cam");
    const arBtn = document.getElementById("arBtn");
    const arIcon = document.getElementById("arIcon");
    const realHint = document.getElementById("realHint");
    let streaming = false;

    const ICON_CAM = '<path d="M3 7h3l2-2h8l2 2h3v12H3z"/><circle cx="12" cy="13" r="3.4"/>';
    const ICON_X = '<path d="M6 6l12 12M18 6L6 18"/>';

    async function startCam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false,
        });
        cam.srcObject = stream;
        await cam.play();
        document.body.classList.add("cam-on");
        streaming = true;
        arIcon.innerHTML = ICON_X;        // becomes a round close button
        realHint.style.display = "none";
        mv.removeAttribute("auto-rotate"); // sit still over the real scene
      } catch (e) {
        realHint.textContent = tr.camDenied;
        realHint.style.display = "flex";
      }
    }

    function stopCam() {
      const s = cam.srcObject;
      if (s) s.getTracks().forEach((tk) => tk.stop());
      cam.srcObject = null;
      document.body.classList.remove("cam-on");
      streaming = false;
      arIcon.innerHTML = ICON_CAM;
      mv.setAttribute("auto-rotate", "");
    }

    arBtn.addEventListener("click", () => (streaming ? stopCam() : startCam()));
    window.addEventListener("pagehide", stopCam);
  </script>
</body>
</html>
