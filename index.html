<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1410" />
  <title>Hobbiton · AR Experience</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:        #0f1410;
      --bg-soft:   #18211a;
      --surface:   #1e2a20;
      --surface-2: #25332700;
      --parchment: #f4e9d0;
      --parchment-dim: #cdbf9f;
      --gold:      #c9a227;
      --gold-soft: #d9bf63;
      --green:     #6b8f4e;
      --green-deep:#3d5a2c;
      --border:    #3a4a32;
      --shadow: 0 20px 50px rgba(0,0,0,.55);
      --r: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Inter", "Noto Sans SC", sans-serif;
      color: var(--parchment);
      background:
        radial-gradient(120% 80% at 50% -10%, #20301d 0%, transparent 55%),
        radial-gradient(100% 70% at 50% 110%, #14201a 0%, transparent 60%),
        var(--bg);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    :lang(zh) h1, :lang(zh) h2, .lang-zh h1, .lang-zh h2 { font-family: "Noto Serif SC", serif; }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: clamp(20px, 5vw, 40px) clamp(18px, 5vw, 32px) 64px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Header ---------- */
    header { text-align: center; padding-top: clamp(24px, 8vh, 72px); }

    .crest {
      width: 64px; height: 64px; margin: 0 auto 22px;
      display: grid; place-items: center;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      box-shadow: 0 0 0 6px rgba(201,162,39,.08), inset 0 0 24px rgba(201,162,39,.12);
    }
    .crest svg { width: 34px; height: 34px; stroke: var(--gold-soft); }

    h1 {
      font-family: "Cinzel", serif;
      font-weight: 700;
      font-size: clamp(2.6rem, 11vw, 4.2rem);
      letter-spacing: .04em;
      line-height: 1;
      color: var(--parchment);
      text-shadow: 0 2px 30px rgba(201,162,39,.25);
    }
    .subtitle {
      margin-top: 14px;
      font-size: clamp(.8rem, 3.4vw, .95rem);
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold-soft);
    }
    .divider {
      width: 130px; height: 1px; margin: 26px auto 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      position: relative;
    }
    .divider::after {
      content: "";
      position: absolute; left: 50%; top: 50%;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold);
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .intro {
      max-width: 460px; margin: 24px auto 0;
      text-align: center;
      color: var(--parchment-dim);
      font-weight: 300;
      line-height: 1.7;
      font-size: clamp(.95rem, 3.8vw, 1.05rem);
    }

    /* ---------- Language selector ---------- */
    .lang-label {
      text-align: center;
      margin: 40px 0 14px;
      font-size: .72rem;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--parchment-dim);
    }
    .langs {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    }
    .lang-btn {
      font-family: inherit;
      font-size: .95rem; font-weight: 500;
      color: var(--parchment);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 11px 22px;
      min-height: 44px;
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease, background .2s ease, color .2s ease;
    }
    .lang-btn:hover { transform: translateY(-1px); border-color: var(--gold); }
    .lang-btn.active {
      background: linear-gradient(180deg, var(--gold) 0%, #b4901f 100%);
      color: #1a1407;
      border-color: var(--gold-soft);
      box-shadow: 0 6px 18px rgba(201,162,39,.3);
    }
    .lang-btn:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; }

    /* ---------- Points ---------- */
    .points { margin-top: 38px; display: flex; flex-direction: column; gap: 16px; }

    .point {
      display: flex; align-items: center; gap: 16px;
      text-decoration: none; color: inherit;
      background:
        linear-gradient(180deg, rgba(40,54,38,.9), rgba(26,36,28,.92));
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 16px 18px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      transition: transform .22s ease, border-color .22s ease;
    }
    .point::before {
      content: "";
      position: absolute; inset: 0 auto 0 0; width: 4px;
      background: var(--accent, var(--green));
    }
    .point:hover { transform: translateY(-2px); border-color: var(--gold); }
    .point:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; }

    .point-icon {
      flex: 0 0 auto;
      width: 52px; height: 52px; border-radius: 14px;
      display: grid; place-items: center;
      background: rgba(0,0,0,.25);
      border: 1px solid var(--border);
    }
    .point-icon svg { width: 28px; height: 28px; stroke: var(--gold-soft); fill: none; stroke-width: 1.6; }

    .point-body { flex: 1 1 auto; min-width: 0; }
    .point-name {
      font-family: "Cinzel", serif;
      font-size: 1.18rem; font-weight: 600;
      letter-spacing: .01em;
    }
    .lang-zh .point-name { font-family: "Noto Serif SC", serif; }
    .point-place {
      font-size: .82rem; color: var(--parchment-dim);
      margin-top: 3px; font-weight: 300;
    }
    .point-badge {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 9px;
      font-size: .68rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--gold-soft);
    }
    .point-badge svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; }

    .point-go {
      flex: 0 0 auto;
      color: var(--parchment-dim);
    }
    .point-go svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }

    /* ---------- Footer ---------- */
    footer {
      margin-top: auto; padding-top: 44px;
      text-align: center;
      color: #6f7d63;
      font-size: .72rem; letter-spacing: .08em;
      font-weight: 300;
    }
    footer .mark { color: var(--gold-soft); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="crest" aria-hidden="true">
        <!-- mountain / ring crest -->
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M5 16l3.5-5 2.5 3 2.5-4L19 16"></path>
        </svg>
      </div>
      <h1 data-i18n="appTitle">Hobbiton</h1>
      <div class="subtitle" data-i18n="appSubtitle">Augmented Reality Experience</div>
      <div class="divider" aria-hidden="true"></div>
      <p class="intro" data-i18n="intro">Walk the Shire and watch its heroes come to life.</p>
    </header>

    <nav aria-label="Language">
      <div class="lang-label" data-i18n="chooseLang">Choose your language</div>
      <div class="langs" id="langs"></div>
    </nav>

    <main class="points" id="points"></main>

    <footer>
      Prototype experience · Hobbiton™ Movie Set · <span class="mark">Middle-earth in AR</span>
    </footer>
  </div>

  <!-- Inline SVG icon library -->
  <svg style="display:none" aria-hidden="true">
    <defs>
      <g id="ic-door"><path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17"/><path d="M4 21h16"/><circle cx="14" cy="12" r="1"/></g>
      <g id="ic-spark"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/></g>
      <g id="ic-dragon"><path d="M3 11c3-1 5 1 7 1s3-3 6-3c2 0 4 1 5 3-2 0-3 1-3 2 0 2-2 4-5 4-4 0-7-3-9-5"/><path d="M16 9l2-3"/></g>
      <g id="ic-qr"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M20 14v.01M14 20v.01M20 20v.01M17 17h.01"/></g>
      <g id="ic-pin"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></g>
      <g id="ic-go"><path d="M5 12h14M13 6l6 6-6 6"/></g>
    </defs>
  </svg>

  <script src="js/config.js"></script>
  <script>
    const langsEl = document.getElementById("langs");
    const pointsEl = document.getElementById("points");

    function icon(id, cls) {
      return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><use href="#ic-${id}"/></svg>`;
    }

    function applyLang(lang) {
      Store.lang = lang;
      const tr = t(lang);
      document.documentElement.lang = lang;
      document.body.classList.toggle("lang-zh", lang === "zh");

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (tr[key]) el.textContent = tr[key];
      });

      // active state on language buttons
      document.querySelectorAll(".lang-btn").forEach((b) =>
        b.classList.toggle("active", b.dataset.lang === lang)
      );

      renderPoints(lang);
    }

    function renderLangs() {
      langsEl.innerHTML = Object.keys(I18N)
        .map(
          (code) =>
            `<button class="lang-btn" data-lang="${code}">${I18N[code].langName}</button>`
        )
        .join("");
      langsEl.querySelectorAll(".lang-btn").forEach((b) =>
        b.addEventListener("click", () => applyLang(b.dataset.lang))
      );
    }

    function renderPoints(lang) {
      const tr = t(lang);
      pointsEl.innerHTML = POINTS.map((p) => {
        const info = tr.points[p.id];
        const page = p.trigger === "gps" ? "gps.html" : "ar.html";
        const badge =
          p.trigger === "gps"
            ? `${icon("pin")}<span>${tr.gpsBadge}</span>`
            : `${icon("qr")}<span>${tr.qrBadge}</span>`;
        return `
          <a class="point" href="${page}?point=${p.id}" style="--accent:${p.accent}">
            <span class="point-icon">${icon(p.icon)}</span>
            <span class="point-body">
              <span class="point-name">${info.name}</span>
              <span class="point-place">${info.place} · ${p.coords}</span>
              <span class="point-badge">${badge}</span>
            </span>
            <span class="point-go">${icon("go")}</span>
          </a>`;
      }).join("");
    }

    renderLangs();
    applyLang(Store.lang);
  </script>
</body>
</html>
