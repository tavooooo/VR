<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Plato de Comida</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body { margin: 0; background-color: #f0f0f0; }
    model-viewer { width: 100vw; height: 100vh; }

    /* SOLUCIÓN FINAL AGRESIVA: MOVER Y DAR ALTA VISIBILIDAD AL BOTÓN NATIVO */
    model-viewer > button {
      position: fixed !important;
      bottom: 60px !important; /* Lo subimos más para evitar la barra de navegación de iOS */
      left: 50% !important;
      transform: translateX(-50%) !important;

      /* Aumentamos visibilidad y contraste */
      background-color: #3f51b5 !important; /* Azul oscuro para alto contraste */
      color: white !important; /* Texto blanco */
      padding: 12px 24px !important;
      border-radius: 8px !important;
      font-size: 18px !important;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); /* Sombra para destacarlo */
      z-index: 9999 !important; /* Máxima prioridad para que se vea encima de todo */
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(240, 240, 240, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.4s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading-container {
      text-align: center;
      font-family: sans-serif;
    }
    #loading-label {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
    }
    #loading-bar-track {
      width: 220px;
      height: 8px;
      background: #ddd;
      border-radius: 4px;
      overflow: hidden;
      margin: 0 auto;
    }
    #loading-bar-fill {
      height: 100%;
      width: 0%;
      background: #3f51b5;
      border-radius: 4px;
      transition: width 0.2s ease;
    }
    #loading-percent {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

  <model-viewer
    src="./plato.glb" 
    ar
    ar-modes="webxr quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    environment-image="neutral"
    scale="1 1 1"
    alt="Plato de Comida en Realidad Aumentada"
    ar-button
  ></model-viewer>

  <div id="loading-overlay">
    <div id="loading-container">
      <div id="loading-label">Cargando modelo...</div>
      <div id="loading-bar-track">
        <div id="loading-bar-fill"></div>
      </div>
      <div id="loading-percent">0%</div>
    </div>
  </div>

  <script>
    const viewer = document.querySelector('model-viewer');
    const overlay = document.getElementById('loading-overlay');
    const fill = document.getElementById('loading-bar-fill');
    const percentLabel = document.getElementById('loading-percent');

    viewer.addEventListener('progress', (e) => {
      const pct = Math.round(e.detail.totalProgress * 100);
      fill.style.width = pct + '%';
      percentLabel.textContent = pct + '%';
    });

    viewer.addEventListener('load', () => {
      overlay.classList.add('hidden');
    });
  </script>
</body>
</html>
