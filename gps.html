<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1410" />
  <title>Hobbiton AR · The Dragon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500&family=Noto+Serif+SC:wght@600&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet" />

  <!-- A-Frame + AR.js (location-based) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    :root {
      --bg: #0f1410; --parchment: #f4e9d0; --parchment-dim: #cdbf9f;
      --gold: #c9a227; --gold-soft: #d9bf63; --border: #3a4a32;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Inter", "Noto Sans SC", sans-serif;
      background: var(--bg); color: var(--parchment);
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Intro / permission gate ---- */
    .gate {
      position: fixed; inset: 0; z-index: 40;
      display: flex; flex-direction: column; justify-content: center;
      padding: 32px 26px calc(32px + env(safe-area-inset-bottom));
      text-align: center;
      background:
        radial-gradient(120% 70% at 50% 0%, #2a1f1a 0%, transparent 55%),
        var(--bg);
      transition: opacity .5s ease;
    }
    .gate.hidden { opacity: 0; pointer-events: none; }
    .gate .crest {
      width: 72px; height: 72px; margin: 0 auto 26px;
      display: grid; place-items: center; border-radius: 50%;
      border: 1.5px solid var(--gold);
      box-shadow: 0 0 0 6px rgba(201,162,39,.08), inset 0 0 26px rgba(168,68,42,.25);
    }
    .gate .crest svg { width: 40px; height: 40px; stroke: var(--gold-soft); fill: none; stroke-width: 1.5; }
    .gate h1 {
      font-family: "Cinzel", serif; font-weight: 700;
      font-size: clamp(1.9rem, 8vw, 2.6rem); letter-spacing: .03em;
    }
    .lang-zh .gate h1, .lang-zh .sheet-name { font-family: "Noto Serif SC", serif; }
    .gate .place {
      margin-top: 10px; color: var(--gold-soft);
      letter-spacing: .2em; text-transform: uppercase; font-size: .74rem;
    }
    .gate p {
      max-width: 420px; margin: 22px auto 0;
      color: var(--parchment-dim); font-weight: 300; line-height: 1.7;
      font-size: clamp(.95rem, 3.8vw, 1.05rem);
    }
    .allow {
      margin: 34px auto 0;
      display: inline-flex; align-items: center; gap: 11px;
      font-family: inherit; font-size: 1.02rem; font-weight: 600;
      color: #1a1407; cursor: pointer;
      background: linear-gradient(180deg, var(--gold) 0%, #b4901f 100%);
      border: 1px solid var(--gold-soft); border-radius: 999px;
      padding: 15px 30px; min-height: 54px;
      box-shadow: 0 12px 34px rgba(201,162,39,.34);
    }
    .allow svg { width: 21px; height: 21px; stroke: #1a1407; fill: none; stroke-width: 1.9; }
    .allow:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .gate .back {
      margin-top: 22px; color: var(--parchment-dim);
      text-decoration: none; font-size: .85rem;
      display: inline-flex; align-items: center; gap: 6px; min-height: 44px;
    }
    .gate .back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ---- In-scene overlay ---- */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 30;
      display: flex; align-items: center; gap: 12px;
      padding: max(16px, env(safe-area-inset-top)) 18px 14px;
      background: linear-gradient(180deg, rgba(15,20,16,.85), transparent);
    }
    .topbar .back {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 44px; padding: 8px 14px 8px 10px;
      color: var(--parchment); text-decoration: none;
      background: rgba(30,42,32,.6); border: 1px solid var(--border);
      border-radius: 999px; font-size: .85rem; font-weight: 500;
      backdrop-filter: blur(8px);
    }
    .topbar .back svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

    .status {
      position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
      transform: translateX(-50%); z-index: 30;
      max-width: 88vw;
      display: flex; align-items: center; gap: 10px;
      padding: 12px 18px; border-radius: 999px;
      background: rgba(20,28,22,.82); border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      color: var(--parchment); font-size: .86rem; text-align: center;
    }
    .status svg { width: 18px; height: 18px; flex: 0 0 auto; stroke: var(--gold-soft); fill: none; stroke-width: 1.8; }
    .status.hidden { display: none; }

    .scene-wrap { position: fixed; inset: 0; z-index: 1; }
    .a-enter-vr, .a-enter-ar { display: none !important; }
  </style>
</head>
<body>
  <!-- Permission / intro gate (also satisfies iOS sensor permission gesture) -->
  <div class="gate" id="gate">
    <div class="crest" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 11c3-1 5 1 7 1s3-3 6-3c2 0 4 1 5 3-2 0-3 1-3 2 0 2-2 4-5 4-4 0-7-3-9-5"/><path d="M16 9l2-3"/></svg>
    </div>
    <h1 id="gName">The Dragon</h1>
    <div class="place" id="gPlace">The Great Tree</div>
    <p id="gStory">Look to the skies above the great tree…</p>
    <button class="allow" id="allowBtn">
      <svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><circle cx="12" cy="12" r="3"/></svg>
      <span id="allowLabel">Allow camera &amp; sensors</span>
    </button>
    <a class="back" id="gBack" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      <span id="gBackLabel">Back to map</span>
    </a>
  </div>

  <!-- In-scene chrome -->
  <div class="topbar" id="chrome" style="display:none">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      <span id="backLabel2">Map</span>
    </a>
  </div>
  <div class="status hidden" id="status">
    <svg viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span id="statusTxt">Locating…</span>
  </div>

  <div class="scene-wrap" id="sceneWrap"></div>

  <script src="js/config.js"></script>
  <script src="js/paper-dragon.js"></script>
  <script>
    const lang = Store.lang;
    const tr = t(lang);
    const point = getPoint("dragon");
    const info = tr.points.dragon;
    if (lang === "zh") document.body.classList.add("lang-zh");
    document.documentElement.lang = lang;

    // Localize gate
    gName.textContent = info.name;
    gPlace.textContent = info.place;
    gStory.textContent = info.story;
    allowLabel.textContent = tr.allow;
    gBackLabel.textContent = tr.back;
    backLabel2.textContent = tr.back;
    statusTxt.textContent = tr.locating;

    async function requestSensors() {
      // iOS 13+ requires an explicit gesture-driven permission request
      try {
        if (typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function") {
          await DeviceOrientationEvent.requestPermission();
        }
        if (typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission === "function") {
          await DeviceMotionEvent.requestPermission();
        }
      } catch (e) { /* user can still proceed; GPS may work without compass */ }
    }

    function buildScene() {
      const { lat, lng, alt } = point.gps;
      const wrap = document.getElementById("sceneWrap");
      wrap.innerHTML = `
        <a-scene
          vr-mode-ui="enabled: false"
          renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true"
          embedded
          arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false; trackingMethod: best">

          <a-camera gps-camera="gpsMinDistance: 5" rotation-reader></a-camera>

          <!-- ground-anchored at The Green Dragon Inn's GPS position -->
          <a-entity gps-entity-place="latitude: ${lat}; longitude: ${lng}">
            <!-- procedural paper dragon: flaps, glides and banks while
                 circling the inn (all flight logic in js/paper-dragon.js) -->
            <a-entity paper-dragon="size: 3; radius: 12; period: 22; altitude: ${alt}"></a-entity>
          </a-entity>
        </a-scene>`;

      const scene = wrap.querySelector("a-scene");
      scene.addEventListener("loaded", () => {
        document.getElementById("status").classList.remove("hidden");
      });
      // gps signal acquired
      window.addEventListener("gps-camera-update-position", () => {
        document.getElementById("statusTxt").textContent = tr.locating;
      }, { once: true });
    }

    document.getElementById("allowBtn").addEventListener("click", async () => {
      await requestSensors();
      document.getElementById("gate").classList.add("hidden");
      document.getElementById("chrome").style.display = "flex";
      buildScene();
    });
  </script>
</body>
</html>
